# Configuration for Docker deployment

# Server port - Docker assigns a PORT environment variable
server.port=${PORT:7015}
server.servlet.context-path=/compra

# Database configuration for PostgreSQL with schema
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/farmaciadb?currentSchema=compra_schema}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=compra_schema
spring.jpa.properties.hibernate.format_sql=true

# JWT configuration
jwt.secret=${JWT_SECRET:miSecretoSuperSecreto123456789012345678901234567890}
jwt.expiration=86400000

# CORS configuration for frontend
cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,https://farmacia-frontend.onrender.com}

# Service URLs
service.producto.url=${SERVICE_PRODUCTO_URL:https://farmacia-producto-kdkd.onrender.com/producto}
service.metodopago.url=${SERVICE_METODOPAGO_URL:https://farmacia-metodopago-kdkd.onrender.com/metodopago}

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized