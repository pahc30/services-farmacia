# Configuración para Render (PostgreSQL)
spring.profiles.active=render
spring.application.name=businessdomain-auth
server.servlet.context-path=/auth
server.port=${PORT:7011}

# Swagger/OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# PostgreSQL Configuration for Render
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jmx.enabled=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# Management endpoints
management.endpoints.web.exposure.include=health,info,metrics

# JWT Configuration (from environment variables)
jwt.secret=${JWT_SECRET:default-secret-key-for-development-only-very-long}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration for Render
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://farmacia-frontend.onrender.com,http://localhost:4200}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.exposed-headers=*
cors.allow-credentials=true