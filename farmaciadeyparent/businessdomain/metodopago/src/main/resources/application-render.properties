# Configuración para Render (PostgreSQL)
spring.profiles.active=render
spring.application.name=businessdomain-metodopago
server.servlet.context-path=/metodopago
server.port=${PORT:7014}

# Swagger/OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# PostgreSQL Configuration for Render
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jmx.enabled=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# Management endpoints
management.endpoints.web.exposure.include=health,info,metrics

# Payment Configuration
payment.provider=${PAYMENT_PROVIDER:simulado}

# CORS Configuration for Render
spring.webflux.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://farmacia-frontend.onrender.com,http://localhost:4200}
spring.webflux.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.webflux.cors.allowed-headers=*
spring.webflux.cors.exposed-headers=*
spring.webflux.cors.allow-credentials=true

# Auth Service URL
auth.service.url=${AUTH_SERVICE_URL:https://farmacia-auth.onrender.com}