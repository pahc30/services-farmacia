# Configuration for Render deployment

# Server port - Render assigns a PORT environment variable
server.port=${PORT:7014}

# Database configuration for PostgreSQL on Render with schema
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/farmaciadb}?currentSchema=metodopago_schema
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=metodopago_schema
spring.jpa.properties.hibernate.format_sql=true

# Payment configuration
stripe.api.key=${STRIPE_API_KEY:sk_test_default}
paypal.client.id=${PAYPAL_CLIENT_ID:client_id_default}
paypal.client.secret=${PAYPAL_CLIENT_SECRET:client_secret_default}

# JWT configuration
jwt.secret=${JWT_SECRET:miSecretoSuperSecreto123456789012345678901234567890}
jwt.expiration=86400000

# CORS configuration for frontend
cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,https://farmacia-frontend.onrender.com}

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized