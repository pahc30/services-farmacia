# Test Profile Configuration
spring.datasource.url=jdbc:h2:mem:metodopagodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Logging configuration for tests
logging.level.pe.com.farmaciadey=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=ERROR

# CORS Configuration
spring.webflux.cors.allowed-origins=http://localhost:4200
spring.webflux.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.webflux.cors.allowed-headers=*
spring.webflux.cors.exposed-headers=*
spring.webflux.cors.allow-credentials=true

# Server port
server.port=9004

# Auth Service URL
auth.service.url=http://localhost:9000