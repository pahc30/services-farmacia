# Configuration for Docker deployment

# Server port - Docker assigns a PORT environment variable
server.port=${PORT:7013}
server.servlet.context-path=/producto

# Database configuration for PostgreSQL with schema
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/farmaciadb?currentSchema=producto_schema}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=producto_schema
spring.jpa.properties.hibernate.format_sql=true

# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=${UPLOAD_DIR:/app/uploads}

# JWT configuration
jwt.secret=${JWT_SECRET:miSecretoSuperSecreto123456789012345678901234567890}
jwt.expiration=86400000

# CORS configuration for frontend
cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,https://farmacia-frontend.onrender.com}

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized