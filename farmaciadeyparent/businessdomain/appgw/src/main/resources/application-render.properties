# Configuración para Render (Gateway)
spring.profiles.active=render
spring.application.name=businessdomain-appgw
server.port=${PORT:9000}

# Swagger/OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Management endpoints
management.endpoints.web.exposure.include=health,info,metrics

# CORS Configuration for Render
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://farmacia-frontend.onrender.com,http://localhost:4200}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.exposed-headers=*
cors.allow-credentials=true

# Microservices URLs for Render
services.auth.url=${AUTH_SERVICE_URL:https://farmacia-auth.onrender.com}
services.usuario.url=${USUARIO_SERVICE_URL:https://farmacia-usuario.onrender.com}
services.producto.url=${PRODUCTO_SERVICE_URL:https://farmacia-producto.onrender.com}
services.metodopago.url=${METODOPAGO_SERVICE_URL:https://farmacia-metodopago.onrender.com}
services.compra.url=${COMPRA_SERVICE_URL:https://farmacia-compra.onrender.com}

# JWT Configuration (for gateway validation)
jwt.secret=${JWT_SECRET:default-secret-key-for-development-only-very-long}