# Configuration for Docker deployment

# Server port - Docker assigns a PORT environment variable
server.port=${PORT:9000}

# Gateway routing configuration
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://farmacia-auth:7011
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=usuario-service
spring.cloud.gateway.routes[1].uri=http://farmacia-usuario:7012
spring.cloud.gateway.routes[1].predicates[0]=Path=/usuario/**

spring.cloud.gateway.routes[2].id=producto-service
spring.cloud.gateway.routes[2].uri=http://farmacia-producto:7013
spring.cloud.gateway.routes[2].predicates[0]=Path=/producto/**

spring.cloud.gateway.routes[3].id=metodopago-service
spring.cloud.gateway.routes[3].uri=http://farmacia-metodopago:7014
spring.cloud.gateway.routes[3].predicates[0]=Path=/metodopago/**

spring.cloud.gateway.routes[4].id=compra-service
spring.cloud.gateway.routes[4].uri=http://farmacia-compra:7015
spring.cloud.gateway.routes[4].predicates[0]=Path=/compra/**

# CORS configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=${CORS_ORIGINS:http://localhost:4200,https://farmacia-frontend.onrender.com}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=when-authorized