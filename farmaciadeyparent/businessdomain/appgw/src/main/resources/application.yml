server:
  port: 9000

spring:
  application:
    name: appgw
  main:
    web-application-type: reactive
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:4200
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth
          uri: http://localhost:7011
          predicates:
            - Path=/auth/**
        - id: usuario
          uri: http://localhost:7012
          predicates:
            - Path=/usuario/**
        - id: producto
          uri: http://localhost:7013
          predicates:
            - Path=/producto/**
        - id: metodopago
          uri: http://localhost:7014
          predicates:
            - Path=/metodopago/**
        - id: compra
          uri: http://localhost:7015
          predicates:
            - Path=/compra/**

# Configuración de logging para reducir warnings DNS en macOS
logging:
  level:
    "[io.netty.resolver.dns.DnsServerAddressStreamProviders]": WARN
    "[io.netty.resolver.dns.macos]": WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
