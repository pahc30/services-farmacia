# Docker Compose for local development and testing with PostgreSQL

services:
  # PostgreSQL Database
  farmacia-db:
    image: postgres:15-alpine
    container_name: farmacia-postgres
    environment:
      POSTGRES_DB: farmaciadb
      POSTGRES_USER: farmacia
      POSTGRES_PASSWORD: farmacia123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmacia -d farmaciadb"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - farmacia-network

  # Auth Microservice
  farmacia-auth:
    build:
      context: .
      dockerfile: businessdomain/auth/Dockerfile
    container_name: farmacia-auth
    environment:
      - SPRING_PROFILES_ACTIVE=render
      - DATABASE_URL=jdbc:postgresql://farmacia-postgres:5432/farmaciadb
      - DB_USERNAME=farmacia
      - DB_PASSWORD=farmacia123
      - JWT_SECRET=miSecretoSuperSecreto123456789012345678901234567890
      - CORS_ORIGINS=http://localhost:4200
    ports:
      - "7011:7011"
    depends_on:
      farmacia-db:
        condition: service_healthy
    networks:
      - farmacia-network

  # Usuario Service
  farmacia-usuario:
    build:
      context: .
      dockerfile: businessdomain/usuario/Dockerfile
    container_name: farmacia-usuario
    environment:
      - SPRING_PROFILES_ACTIVE=render
      - DATABASE_URL=jdbc:postgresql://farmacia-postgres:5432/farmaciadb
      - DB_USERNAME=farmacia
      - DB_PASSWORD=farmacia123
      - JWT_SECRET=miSecretoSuperSecreto123456789012345678901234567890
      - CORS_ORIGINS=http://localhost:4200
    ports:
      - "7012:7012"
    depends_on:
      farmacia-db:
        condition: service_healthy
    networks:
      - farmacia-network

  # Producto Service
  farmacia-producto:
    build:
      context: .
      dockerfile: businessdomain/producto/Dockerfile
    container_name: farmacia-producto
    environment:
      - SPRING_PROFILES_ACTIVE=render
      - DATABASE_URL=jdbc:postgresql://farmacia-postgres:5432/farmaciadb
      - DB_USERNAME=farmacia
      - DB_PASSWORD=farmacia123
      - JWT_SECRET=miSecretoSuperSecreto123456789012345678901234567890
      - CORS_ORIGINS=http://localhost:4200
    ports:
      - "7013:7013"
    depends_on:
      farmacia-db:
        condition: service_healthy
    networks:
      - farmacia-network

  # MetodoPago Service
  farmacia-metodopago:
    build:
      context: .
      dockerfile: businessdomain/metodopago/Dockerfile
    container_name: farmacia-metodopago
    environment:
      - SPRING_PROFILES_ACTIVE=render
      - DATABASE_URL=jdbc:postgresql://farmacia-postgres:5432/farmaciadb
      - DB_USERNAME=farmacia
      - DB_PASSWORD=farmacia123
      - JWT_SECRET=miSecretoSuperSecreto123456789012345678901234567890
      - CORS_ORIGINS=http://localhost:4200
      - STRIPE_API_KEY=sk_test_default
      - PAYPAL_CLIENT_ID=client_id_default
      - PAYPAL_CLIENT_SECRET=client_secret_default
    ports:
      - "7014:7014"
    depends_on:
      farmacia-db:
        condition: service_healthy
    networks:
      - farmacia-network

  # Compra Service
  farmacia-compra:
    build:
      context: .
      dockerfile: businessdomain/compra/Dockerfile
    container_name: farmacia-compra
    environment:
      - SPRING_PROFILES_ACTIVE=render
      - DATABASE_URL=jdbc:postgresql://farmacia-postgres:5432/farmaciadb
      - DB_USERNAME=farmacia
      - DB_PASSWORD=farmacia123
      - JWT_SECRET=miSecretoSuperSecreto123456789012345678901234567890
      - CORS_ORIGINS=http://localhost:4200
    ports:
      - "7015:7015"
    depends_on:
      farmacia-db:
        condition: service_healthy
    networks:
      - farmacia-network

  # Gateway Service
  farmacia-gateway:
    build:
      context: .
      dockerfile: businessdomain/appgw/Dockerfile
    container_name: farmacia-gateway
    environment:
      - SPRING_PROFILES_ACTIVE=render
      - CORS_ORIGINS=http://localhost:4200
    ports:
      - "9000:9000"
    depends_on:
      - farmacia-auth
      - farmacia-usuario
      - farmacia-producto
      - farmacia-metodopago
      - farmacia-compra
    networks:
      - farmacia-network

# Networks
networks:
  farmacia-network:
    driver: bridge

# Volumes
volumes:
  postgres_data: