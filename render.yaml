services:
  # Auth Microservice
  - type: web
    name: farmacia-auth
    env: docker
    dockerfilePath: ./farmaciadeyparent/businessdomain/auth/Dockerfile
    dockerContext: ./farmaciadeyparent
    region: oregon
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 7011
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DATABASE_URL
        value: "jdbc:postgresql://dpg-d4bmaqripnbc73feb4j0-a.virginia-postgres.render.com:5432/farmaciadb_9q62?user=farmacia&password=9k3emRoEFBdgNTuwVaqYOS9ppeHREht6&currentSchema=auth_schema"
      - key: DB_USERNAME
        value: farmacia
      - key: DB_PASSWORD
        value: 9k3emRoEFBdgNTuwVaqYOS9ppeHREht6
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://farmaciadey.onrender.com

  # Usuario Microservice
  - type: web
    name: farmacia-usuario
    env: docker
    dockerfilePath: ./farmaciadeyparent/businessdomain/usuario/Dockerfile
    dockerContext: ./farmaciadeyparent
    region: oregon
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 7012
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DATABASE_URL
        value: "jdbc:postgresql://dpg-d4bmaqripnbc73feb4j0-a.virginia-postgres.render.com:5432/farmaciadb_9q62?user=farmacia&password=9k3emRoEFBdgNTuwVaqYOS9ppeHREht6&currentSchema=usuario_schema"
      - key: DB_USERNAME
        value: farmacia
      - key: DB_PASSWORD
        value: 9k3emRoEFBdgNTuwVaqYOS9ppeHREht6
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://farmaciadey.onrender.com

  # Producto Microservice  
  - type: web
    name: farmacia-producto
    env: docker
    dockerfilePath: ./farmaciadeyparent/businessdomain/producto/Dockerfile
    dockerContext: ./farmaciadeyparent
    region: oregon
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 7013
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DATABASE_URL
        value: "jdbc:postgresql://dpg-d4bmaqripnbc73feb4j0-a.virginia-postgres.render.com:5432/farmaciadb_9q62?user=farmacia&password=9k3emRoEFBdgNTuwVaqYOS9ppeHREht6&currentSchema=producto_schema"
      - key: DB_USERNAME
        value: farmacia
      - key: DB_PASSWORD
        value: 9k3emRoEFBdgNTuwVaqYOS9ppeHREht6
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://farmaciadey.onrender.com
      - key: UPLOAD_DIR
        value: /app/uploads

  # MetodoPago Microservice
  - type: web
    name: farmacia-metodopago
    env: docker
    dockerfilePath: ./farmaciadeyparent/businessdomain/metodopago/Dockerfile
    dockerContext: ./farmaciadeyparent
    region: oregon
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 7014
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DATABASE_URL
        value: "jdbc:postgresql://dpg-d4bmaqripnbc73feb4j0-a.virginia-postgres.render.com:5432/farmaciadb_9q62?user=farmacia&password=9k3emRoEFBdgNTuwVaqYOS9ppeHREht6&currentSchema=metodopago_schema"
      - key: DB_USERNAME
        value: farmacia
      - key: DB_PASSWORD
        value: 9k3emRoEFBdgNTuwVaqYOS9ppeHREht6
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://farmaciadey.onrender.com
      - key: STRIPE_API_KEY
        value: sk_test_default
      - key: TZ
        value: America/Lima
      - key: PAYPAL_CLIENT_ID
        value: client_id_default
      - key: PAYPAL_CLIENT_SECRET
        value: client_secret_default

  # Compra Microservice
  - type: web
    name: farmacia-compra
    env: docker
    dockerfilePath: ./farmaciadeyparent/businessdomain/compra/Dockerfile
    dockerContext: ./farmaciadeyparent
    region: oregon
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 7015
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DATABASE_URL
        value: "jdbc:postgresql://dpg-d4bmaqripnbc73feb4j0-a.virginia-postgres.render.com:5432/farmaciadb_9q62?user=farmacia&password=9k3emRoEFBdgNTuwVaqYOS9ppeHREht6&currentSchema=compra_schema"
      - key: DB_USERNAME
        value: farmacia
      - key: DB_PASSWORD
        value: 9k3emRoEFBdgNTuwVaqYOS9ppeHREht6
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://farmaciadey.onrender.com

  # Gateway Microservice (API Gateway)
  - type: web
    name: farmacia-gateway
    env: docker
    dockerfilePath: ./farmaciadeyparent/businessdomain/appgw/Dockerfile
    dockerContext: ./farmaciadeyparent
    region: oregon
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 9000
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: CORS_ORIGINS
        value: https://farmaciadey.onrender.com
      - key: AUTH_SERVICE_URL
        value: https://farmacia-auth-kdkd.onrender.com
      - key: USUARIO_SERVICE_URL
        value: https://farmacia-usuario-kdkd.onrender.com
      - key: PRODUCTO_SERVICE_URL
        value: https://farmacia-producto-kdkd.onrender.com
      - key: METODOPAGO_SERVICE_URL
        value: https://farmacia-metodopago-kdkd.onrender.com
      - key: COMPRA_SERVICE_URL
        value: https://farmacia-compra-kdkd.onrender.com
